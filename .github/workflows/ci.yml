name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # forge-std is a submodule. Without this the contracts do not compile, `forge test`
      # fails at import resolution, and the failure looks like a Solidity error rather than
      # a missing checkout option.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          # Must satisfy the root engines field, which requires >=22.18.0 because these
          # packages have no build step: Node runs the .ts sources directly by stripping
          # types, and that is only on by default from 22.18. On Node 20 the entry-point
          # suite fails, since it hands each package's entry point to plain node.
          node-version: 22
          cache: npm

      - run: npm ci

      # Verified checksum, same as the local instructions in the README. A security
      # project that installs its own toolchain unverified would be hard to defend.
      - name: Install Foundry
        run: |
          set -euo pipefail
          mkdir -p .tools/dl
          base=https://github.com/foundry-rs/foundry/releases/download/v1.8.1
          curl -sSLo .tools/dl/foundry.tar.gz    "$base/foundry_v1.8.1_linux_amd64.tar.gz"
          curl -sSLo .tools/dl/foundry.sha256    "$base/foundry_v1.8.1_linux_amd64.sha256"
          expected=$(cut -d' ' -f1 .tools/dl/foundry.sha256)
          actual=$(sha256sum .tools/dl/foundry.tar.gz | cut -d' ' -f1)
          echo "expected: $expected"
          echo "actual:   $actual"
          case "$expected" in
            [0-9a-f]*) ;;
            *) echo "digest missing or malformed"; exit 1 ;;
          esac
          [ "$expected" = "$actual" ] || { echo "CHECKSUM MISMATCH"; exit 1; }
          mkdir -p .tools/foundry
          tar -xzf .tools/dl/foundry.tar.gz -C .tools/foundry
          echo "$PWD/.tools/foundry" >> "$GITHUB_PATH"

      # Foundry now runs BEFORE the JavaScript suites, which is a change of order rather than
      # a cosmetic one.
      #
      # `contracts/out` is gitignored, and two test files read it: app/test/policy.test.ts
      # compares the browser write-boundary allowlist against the compiled ABIs, and
      # e2e/test/abi.test.ts checks every hand-written fragment against the artifacts. Both
      # exist to catch drift between Solidity and TypeScript, so both need the artifacts to
      # be present. With the old ordering they failed in CI on a missing directory while
      # passing locally, where a build had already happened at some point.
      - name: Build contracts
        run: forge build
        working-directory: contracts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Contract tests
        run: forge test -vv
        working-directory: contracts

      # Needs the artifacts the contract build produces, and Anvil from the step above.
      - name: End-to-end tests
        run: npm run test:e2e

  # The dashboard builds as a static export, so this job proves the whole thing renders to
  # files without a server. Separate from `test` because a Next build is slow and has no
  # reason to block the contract and end-to-end suites.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The live deployment's public configuration, so CI builds the dashboard that actually ships
      # rather than a differently-configured one.
      #
      # Added because the export check grew a section that reads the bundle for the LockstepLens
      # address, and `NEXT_PUBLIC_*` values are inlined at build time -- an unset one leaves no trace,
      # so a build without these produces an export that silently shows sample data and never reads
      # the Lens. That is a different artifact from the deployed one, and checking it proves less.
      #
      # Every value is public by construction: `NEXT_PUBLIC_*` is compiled into the client bundle, so
      # nothing secret can be passed this way even by mistake. All of them are also in .env.example
      # and in the README. Repository variables were considered and rejected: a fork would build with
      # them empty and fail the check for a reason that has nothing to do with the change.
      # One step, via `npm run verify:dashboard`, which is build then generate `_headers` then
      # check the export.
      #
      # It was two steps — build, then check — and the `_headers` generator was added to
      # `deploy-dashboard.yml` without being added here. So CI built an export with no host
      # headers and the export check failed on its own new assertion, which is the check doing
      # exactly its job and is also a sequence nobody should have to remember in two places.
      #
      # The script is now the single definition of "a dashboard build that is fit to ship", and
      # it is the same command a developer runs locally. CI and a laptop cannot diverge on it.
      #
      # A green build only proves it compiled. This also checks the exported HTML contains the
      # interface, that fonts were emitted locally rather than fetched from a CDN, that the write
      # boundary holds — no ABI fragment for approvePin, publish or execute reached the bundle,
      # and the three narrowing writes did — that the mock-bond disclosure is present, and that
      # the headers a static host must send were generated.
      - name: Build and verify the dashboard
        env:
          NEXT_PUBLIC_CHAIN_ID: "10143"
          NEXT_PUBLIC_RPC_URL: https://testnet-rpc.monad.xyz
          NEXT_PUBLIC_PIN_REGISTRY: "0xF0800974aE84F55508E3e31F72A52E09b19829B0"
          NEXT_PUBLIC_ACCOUNT_ADDRESS: "0x209C903f68f169C8e654e0C3C91cAdc4C4A4aFF2"
          NEXT_PUBLIC_DEPLOY_BLOCK: "61714757"
          NEXT_PUBLIC_PIN_IDS: "0x6520d020348ee7a8a91fcc071d0f62cf83762c47be749e6654c7ca31c0472df4"
          NEXT_PUBLIC_LOCKSTEP_LENS: "0xEB0A033CfDD1e8393Ac512de0DEc36d6C9323Ebc"
          NEXT_PUBLIC_LOCKSTEP_GUARD: "0xee23156D1B7D64aF1b3671290DdcEf6edF734a81"
        run: npm run verify:dashboard

  # Envio's CLI ships native binaries for linux and darwin only, so codegen cannot run
  # on a Windows dev machine. This job is where the indexer's config, schema, and
  # generated bindings actually get verified.
  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: indexer/package-lock.json

      - name: Install
        run: npm install
        working-directory: indexer

      # Fails if config.yaml, schema.graphql, and the handlers disagree — which is the
      # only way to know the handlers compile against the bindings they import.
      - name: Codegen
        run: npx envio codegen
        working-directory: indexer

      # What codegen actually emitted, and which binary produced it.
      #
      # Kept rather than deleted after debugging. Codegen writes its bindings somewhere and
      # prints nothing about where; the directory cannot exist on the Windows machine this is
      # developed on; and the handlers' `import from "generated"` resolves through a tsconfig
      # path mapping that has to name a real file. When that is wrong the failure is TS2307
      # plus twenty cascading implicit-any errors, which say nothing about the cause.
      #
      # The version and resolved path are printed too, because the first theory here was a
      # wrong path mapping and the actual finding was that codegen exits 0 while producing no
      # `generated/` at all — which is a question about the binary, not the mapping.
      - name: Show generated bindings
        run: |
          echo "--- envio version and resolved binary ---"
          npx envio --version || true
          ls -la node_modules/.bin/ | grep -i envio || echo "no envio in .bin"
          echo "--- indexer directory after codegen ---"
          ls -la
          echo "--- anything named generated, anywhere ---"
          find . -maxdepth 3 -name "generated" -not -path "./node_modules/*" || echo "none"
          echo "--- any .gen.ts or .res.js produced ---"
          find . -maxdepth 4 \( -name "*.gen.ts" -o -name "*.res.js" \) -not -path "./node_modules/*" | head -30 || echo "none"
        working-directory: indexer

      # `npm run typecheck`, not `npx tsc`.
      #
      # This package had no typescript dependency, so `npx tsc` resolved to a package
      # literally named `tsc` on the public registry, downloaded it, and ran it. Its output
      # is "This is not the tsc command you are looking for" and it exits 1, which read as a
      # type error for the whole time this job had never been run. npx silently fetching an
      # unrelated package because a local binary is missing is a supply-chain hazard, and a
      # sharp one to have shipped in a project about supply-chain provenance.
      #
      # typescript is now a declared devDependency and this goes through the package script,
      # so it can only ever run the local binary.
      - name: Typecheck handlers
        run: npm run typecheck
        working-directory: indexer
