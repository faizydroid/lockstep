name: Pin skill

# Publishing a pin belongs in CI, not on a laptop. The executable bit is not
# representable on Windows filesystems, so a skill containing an executable script
# hashes differently there — Linux CI is the only place a pin is reliably reproducible.
#
# Note the split: pull requests dry-run, which needs no key and makes a capability
# change visible in review. Only a push to main publishes.

# Automatic triggers are off until the registry is redeployed. This is a temporary,
# stated condition rather than an abandoned workflow.
#
# Two independent reasons it cannot succeed right now, and both are the system working:
#
#   1. `publish` takes a struct since the version id became a derived value. The registry
#      recorded in `vars.PIN_REGISTRY` was deployed before that, so its selector differs
#      and the call cannot land.
#   2. Even against a matching registry, the demo manifest's bytes changed with the
#      `maxValuePerCall` -> `maxValuePerBatch` rename, so republishing under the same
#      version is exactly the equivocation this action refuses to help commit. The right
#      response is a version bump, which belongs with the redeploy rather than before it.
#
# The first run of this workflow, triggered by that manifest edit, found a real defect:
# every hyphenated input was unreachable because the runner sets `INPUT_SKILL-DIR` and the
# action read `INPUT_SKILL_DIR`. Fixed, and the e2e fixture now uses the runner's real
# convention instead of the code's assumption. Restore the `pull_request` and `push`
# triggers below when the redeploy lands.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill:
          - demo/skills/kuru-quote

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, matching ci.yml. The root `engines` field requires >=22.18.0 because these packages
          # are run as TypeScript by plain node, and that is only on by default from 22.18.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the action
        run: npm run build --workspace @lockstep/action

      # Dry run on pull requests. No key is needed, and the job summary shows the
      # capability diff and bond price before anything is published.
      - name: Price the pin
        if: github.event_name == 'pull_request'
        uses: ./action
        with:
          skill-dir: ${{ matrix.skill }}
          pin-registry: ${{ vars.PIN_REGISTRY }}
          chain-id: ${{ vars.CHAIN_ID || '10143' }}
          rpc-url: ${{ vars.RPC_URL || 'https://testnet-rpc.monad.xyz' }}
          dry-run: "true"

      # Publish only from main. `fail-on-capability-change` stays at its default of
      # true, so a widened blast radius turns the release red instead of shipping
      # quietly and forcing every user to re-approve.
      - name: Publish the pin
        if: github.event_name != 'pull_request'
        uses: ./action
        with:
          skill-dir: ${{ matrix.skill }}
          pin-registry: ${{ vars.PIN_REGISTRY }}
          chain-id: ${{ vars.CHAIN_ID || '10143' }}
          rpc-url: ${{ vars.RPC_URL || 'https://testnet-rpc.monad.xyz' }}
          publisher-private-key: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
