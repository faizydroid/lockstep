name: Pin skill

# Publishing a pin belongs in CI, not on a laptop. The executable bit is not
# representable on Windows filesystems, so a skill containing an executable script
# hashes differently there — Linux CI is the only place a pin is reliably reproducible.
#
# Note the split: pull requests dry-run, which needs no key and makes a capability
# change visible in review. A push to main publishes, and so does a manual run:
# `workflow_dispatch` takes the publish path, not the dry run.

# ## Settings this workflow reads, all configured
#
# Deployment settings live in GitHub's Actions variables and secrets rather than in the repository:
#
#   vars.PIN_REGISTRY              0xF0800974aE84F55508E3e31F72A52E09b19829B0, the live registry
#   vars.CHAIN_ID                  10143
#   vars.RPC_URL                   https://testnet-rpc.monad.xyz
#   vars.PREVIOUS_PIN_ID           the pin the next release replaces; now kuru-quote 3.0.0,
#                                  0x6520d020348ee7a8a91fcc071d0f62cf83762c47be749e6654c7ca31c0472df4
#   secrets.PUBLISHER_PRIVATE_KEY  the SEPARATED publisher, 0xcc71E1f66CA325A9D3dEC74b2AA94CDF870194Dc.
#                                  Deliberately not the account key: one address publishing,
#                                  bonding and approving demonstrates no adversarial relationship.
#
# `PREVIOUS_PIN_ID` is what makes the widening check possible on Monad's public RPC, which refuses
# any `eth_getLogs` over 100 blocks and so cannot serve the history lookup the action would
# otherwise make. Without it a release of a skill this publisher already shipped fails closed.
#
# ## What a push does today, and what the next release needs
#
# kuru-quote 3.0.0 is already published, and the action treats an identical byte set as a no-op
# ("already published: these exact bytes are pinned"), so a push that does not touch the skill's
# bytes is green and sends nothing.
#
# A real release needs three things, in this order:
#
#   1. Bump `version` in demo/skills/kuru-quote/lockstep.json. Changing bytes under 3.0.0 is the
#      equivocation the action refuses to help commit, and that refusal is a red check by design.
#   2. Deposit enough bond first. All 1,150 mAUSD the publisher holds is locked against 3.0.0, so
#      unlocked bond is zero and the publish would fail on `Insufficient unlocked bond`.
#   3. After it lands, set `PREVIOUS_PIN_ID` to the new pin id from the run summary.
#
# ## History worth keeping
#
# The first run of this workflow found that every hyphenated input was unreachable, because the
# runner sets `INPUT_SKILL-DIR` and the action read `INPUT_SKILL_DIR`. Then, before these triggers
# were restored, the widening check turned out to scan logs from genesis, which Monad's RPC refuses,
# so every real publish through v0.1.1 would have failed (FINDINGS.md §39). Both survived because
# the workflow only ran when the skill changed. It now also runs when the action or this file
# changes, so the action is exercised against the live registry whenever it is touched.
on:
  pull_request:
    paths:
      - "demo/skills/**"
      - "action/**"
      - ".github/workflows/pin-skill.yml"
  push:
    branches: [main]
    paths:
      - "demo/skills/**"
      - "action/**"
      - ".github/workflows/pin-skill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill:
          - demo/skills/kuru-quote

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, matching ci.yml. The root `engines` field requires >=22.18.0 because these packages
          # are run as TypeScript by plain node, and that is only on by default from 22.18.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the action
        run: npm run build --workspace @lockstep/action

      # Dry run on pull requests. No key is needed, and the job summary shows the
      # capability diff and bond price before anything is published.
      - name: Price the pin
        if: github.event_name == 'pull_request'
        uses: ./action
        with:
          skill-dir: ${{ matrix.skill }}
          pin-registry: ${{ vars.PIN_REGISTRY }}
          chain-id: ${{ vars.CHAIN_ID || '10143' }}
          rpc-url: ${{ vars.RPC_URL || 'https://testnet-rpc.monad.xyz' }}
          previous-pin-id: ${{ vars.PREVIOUS_PIN_ID }}
          dry-run: "true"

      # Publish only from main. `fail-on-capability-change` stays at its default of
      # true, so a widened blast radius turns the release red instead of shipping
      # quietly and forcing every user to re-approve.
      - name: Publish the pin
        if: github.event_name != 'pull_request'
        uses: ./action
        with:
          skill-dir: ${{ matrix.skill }}
          pin-registry: ${{ vars.PIN_REGISTRY }}
          chain-id: ${{ vars.CHAIN_ID || '10143' }}
          rpc-url: ${{ vars.RPC_URL || 'https://testnet-rpc.monad.xyz' }}
          previous-pin-id: ${{ vars.PREVIOUS_PIN_ID }}
          publisher-private-key: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
