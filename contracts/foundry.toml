[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
gas_reports = ["LockstepGuard", "PinRegistry"]
# The guard sits in the signing path of funded accounts. Treat warnings as defects.
deny = "warnings"

[lint]
# Two different things are being kept apart here, and conflating them is why this
# needed revisiting.
#
# `deny = "warnings"` above is about COMPILER warnings — shadowed declarations,
# unused variables, unreachable code. Those are defects in a contract that sits in
# the signing path of funded accounts and they stay fatal.
#
# Foundry's lint suite is static analysis, closer to Slither. On first run against
# v1.8.1 it produced 112 findings, 41 of them in `src/`, and essentially all of them
# describe this design working as intended: a batch forwarder that reverts per call,
# emits its receipt after the calls it attests to, and sends value to an allowlisted
# target under a per-call ceiling. A gate that can only be satisfied by forty inline
# suppressions produces no signal, so the categories that fire on intended design are
# excluded by name, each with the reason. Anything outside this list still fails the
# build.
#
# Every exclusion below was checked against the actual call sites, not assumed.
exclude_lints = [
  # --- style, excluded originally and still ---
  "screaming-snake-case-immutable",
  "screaming-snake-case-const",
  "multi-contract-file",
  "literal-instead-of-constant",
  "inline-assembly",

  # The guard's whole job is forwarding an arbitrary call, and the gas suite
  # deliberately measures a raw `.call`.
  "low-level-calls",

  # `execute` must revert inside its loop. Fail-closed enforcement means the first
  # disallowed call in a batch aborts the whole batch; collecting failures and
  # continuing would settle some of the calls an owner did not approve.
  "require-revert-in-loop",

  # The guard IS a loop of external calls. LockstepLens also iterates a
  # caller-supplied client array, which is ERC-8004's shape rather than a choice.
  "calls-loop",

  # Receipts are emitted after the calls they attest to, deliberately: `SkillExecuted`
  # records what happened, so it cannot precede it. There is no post-call state left to
  # corrupt — the guard holds no balances and writes no storage after the batch.
  "reentrancy-events",

  # Forwarding value to an allowlisted target under the pin's `maxValuePerCall` ceiling
  # is the product. The lint cannot see that both the target and the amount were checked
  # against on-chain policy two lines earlier.
  "arbitrary-send-eth",

  # All seven in src/ were read individually. `uint32(targets.length)` cannot truncate
  # because `publish` rejects anything over MAX_CAPABILITIES = 64 before reaching it;
  # `uint64(block.timestamp)` overflows in roughly the year 584 billion; and
  # `bytes4(keccak256(...))` is the definition of a function selector, where narrowing
  # is the entire operation.
  "unsafe-typecast",

  # The unbonding delay is a wall-clock duration, so wall-clock time is the correct
  # source. Block numbers would make the delay depend on block production rate.
  "block-timestamp",

  # `publish` and `revoke` do emit events. The lint wants a different shape for
  # permissioned setters, and this registry has no owner to gate.
  "missing-events-access-control",

  # Deliberate: the guard declares no interface. Under EIP-7702 its code runs at an
  # account address, and advertising an interface would invite tooling to treat a user's
  # account as a contract implementing it.
  "missing-inheritance",

  # --- notes and test-suite noise ---
  # `unused-return` is 41 findings, all in tests ignoring a return they do not assert on.
  # The rest are style or complexity notes on code whose shape is load-bearing.
  "unused-return",
  "unwrapped-modifier-logic",
  "cyclomatic-complexity",
  "costly-loop",
  "unused-import",
  "boolean-cst",
  "divide-before-multiply",
  "locked-ether",
  "missing-zero-check",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 32

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"
